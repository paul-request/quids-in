name: Import data and deploy to GitHub Pages

# Every deployment imports fresh FPL data so merges never overwrite the live
# site with the (stale) checked-in snapshot.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      use_committed_snapshot:
        description: >-
          Emergency only: skip the FPL import and deploy the committed
          (possibly stale) season snapshot, e.g. to ship a fix during an FPL
          outage.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Worst case ~9 min per import attempt if every FPL request times out and
    # retries; three attempts plus back-off fit within this limit.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import current FPL season data
        if: ${{ !inputs.use_committed_snapshot }}
        run: scripts/retry.sh 3 60 npm run import:season-data
      - name: Warn that the committed snapshot is being deployed
        if: ${{ inputs.use_committed_snapshot }}
        run: >-
          echo "::warning::FPL import skipped. Deploying the committed season
          snapshot; the site will show its older 'Data last refreshed' time
          until the next successful import."
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: season-2026-27-${{ github.run_id }}
          path: data/season-2026-27.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
