name: Import data and deploy to GitHub Pages

# Every deployment imports fresh FPL data so merges never overwrite the live
# site with the (stale) checked-in snapshot.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import current FPL season data
        run: scripts/retry.sh 3 60 npm run import:season-data
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: season-2026-27-${{ github.run_id }}
          path: data/season-2026-27.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
