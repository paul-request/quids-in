name: Import and deploy season data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: import-and-deploy-season-data
  cancel-in-progress: false

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import current FPL season data
        run: npm run import:season-data
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: season-2026-27-${{ github.run_id }}
          path: data/season-2026-27.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
